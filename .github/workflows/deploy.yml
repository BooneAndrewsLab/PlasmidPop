name: Deploy to GitHub Pages

# Builds the PWA and publishes it to GitHub Pages when a GitHub Release is
# published, so the live site is always a release: the version a Zenodo DOI
# names is the version users are running. A push to main is checked by
# ci.yml and deploys nothing. "Run workflow" redeploys by hand; run it from
# a release tag, since it builds whatever ref it is started on.
# The tests are not run again here: the release commit must already have a
# green ci.yml run, which the first step checks (#374).
# Pages is enabled in the repository settings with "GitHub Actions" as
# source. The site is served under /<repo>/, which BASE_PATH passes to Vite.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require a green CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$n" -eq 0 ]; then
            echo "::error::No successful ci.yml run for $GITHUB_SHA; wait for CI on main, then publish."
            exit 1
          fi
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Usage statistics: cookieless, no sequence data (see docs/guide/02-files.md).
          # Unset = tracker off, which is what a local build gets.
          VITE_MATOMO_URL: https://boonelab.ccbr.utoronto.ca/matomo/
          VITE_MATOMO_SITE_ID: '6'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
