        <h1>PlasmidPop: free DNA sequence editor and plasmid viewer</h1>
        <p>
          PlasmidPop is a free, open-source (MIT) DNA sequence editor and plasmid viewer that runs
          in your browser. Open, edit and save GenBank, FASTA and SnapGene files; annotate features;
          view linear and circular maps; find restriction sites, ORFs and primers; run pairwise
          alignments. All computation is client-side: there is no account and no server, and your
          files stay on your device.
        </p>
